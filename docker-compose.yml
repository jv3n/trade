services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolioai-postgres
    environment:
      POSTGRES_DB: portfolioai
      POSTGRES_USER: portfolioai
      POSTGRES_PASSWORD: portfolioai
    # Without it Tilt turns the resource green as soon as the container is up, and the backend
    # starts against a Postgres that is not accepting connections yet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolioai -d portfolioai"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      # The host port is configurable via `.env` (POSTGRES_HOST_PORT) in case of a conflict with
      # another local service. The container's internal port stays 5432 — only the host:container
      # mapping changes.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

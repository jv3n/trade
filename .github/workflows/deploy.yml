name: Deploy to Cloud Run

# Publishing a GitHub Release deploys ; pushing to `master` does not. A deploy stays a deliberate
# act. The tag picks the environment (#297) : a release candidate `vX.Y.Z-rcN` goes to staging, a
# release `vX.Y.Z` to production — nothing reaches production without a candidate tried first.
on:
  release:
    types: [published]

# Never two deploys of the same environment at once, and never cancel one : a half-applied deploy
# leaves Cloud Run in an inconsistent state, so the second waits instead.
concurrency:
  group: deploy-${{ contains(github.event.release.tag_name, '-rc') && 'staging' || 'production' }}
  cancel-in-progress: false

# Declared at workflow level so a job added later doesn't start from the permissive default token.
permissions:
  contents: read

jobs:
  deploy:
    name: Build, push, deploy
    # Pinned rather than ubuntu-latest : the move to Ubuntu 26 is done on purpose (#274).
    runs-on: ubuntu-24.04
    # Production keeps its required reviewer ; staging has none, a candidate goes straight out.
    environment: ${{ contains(github.event.release.tag_name, '-rc') && 'staging' || 'production' }}
    permissions:
      contents: read
      # Short-lived OIDC token exchanged for a GCP one — no long-lived service-account key in
      # GitHub Secrets.
      id-token: write

    steps:
      # A mistyped release tag would otherwise build an image under a nonsense tag.
      - name: Validate release tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must match ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ (e.g. v0.7.0 or v0.7.0-rc1). See devops/README.md > Releasing."
            exit 1
          fi
          # The tag routes the deploy, the pre-release box is what GitHub shows : they must agree,
          # or a candidate would be listed as the latest release.
          PRERELEASE="${{ github.event.release.prerelease }}"
          if [[ "$TAG" == *-rc* && "$PRERELEASE" != "true" ]]; then
            echo "::error::'$TAG' is a release candidate : publish it as a pre-release."
            exit 1
          fi
          if [[ "$TAG" != *-rc* && "$PRERELEASE" == "true" ]]; then
            echo "::error::'$TAG' is a final release : untick « Set as a pre-release », or tag it vX.Y.Z-rcN."
            exit 1
          fi
          echo "Release tag '$TAG' matches SemVer policy."

      # Everything that differs between the two environments, in one place. Staging shares the
      # image, the Google OAuth client and the Sentry project ; it has its own service, runtime
      # account, database and admin list.
      - name: Resolve the target environment
        id: target
        run: |
          if [[ "${{ github.event.release.tag_name }}" == *-rc* ]]; then
            {
              echo "name=staging"
              echo "service=portfolioai-staging"
              echo "url=https://staging.tickerstory.org/"
              echo "runtime_sa=portfolioai-staging-runtime"
              echo "secret_suffix=-staging"
              echo "max_instances=1"
              echo "sentry_env=staging"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=production"
              echo "service=portfolioai"
              echo "url=https://tickerstory.org/"
              echo "runtime_sa=portfolioai-runtime"
              echo "secret_suffix="
              echo "max_instances=3"
              echo "sentry_env=prod"
            } >> "$GITHUB_OUTPUT"
          fi

      # Full history and tags : the default shallow clone exposes neither the annotated tag nor the
      # parent SHAs, and `gradle-git-properties` needs both.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker credential helper for Artifact Registry
        run: gcloud auth configure-docker northamerica-northeast1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: northamerica-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/backend/portfolioai:${{ github.event.release.tag_name }}
          # One source of truth : the release tag is the image tag, the OCI label, the Sentry
          # release and `build.version` on `/actuator/info`.
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      # The public URLs are passed literally : Cloud Run strips the `X-Forwarded-Host` the Worker
      # sends, so Spring cannot infer the public hostname on its own.
      - name: Deploy revision to Cloud Run
        run: |
          gcloud run deploy ${{ steps.target.outputs.service }} \
            --image=northamerica-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/backend/portfolioai:${{ github.event.release.tag_name }} \
            --region=northamerica-northeast1 \
            --project=${{ vars.GCP_PROJECT }} \
            --platform=managed \
            --service-account=${{ steps.target.outputs.runtime_sa }}@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=${{ steps.target.outputs.max_instances }} \
            --timeout=300 \
            --port=8080 \
            --set-env-vars=SPRING_PROFILES_ACTIVE=prod,APP_FRONTEND_URL=${{ steps.target.outputs.url }},SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=${{ steps.target.outputs.url }}login/oauth2/code/google,SENTRY_RELEASE=${{ github.event.release.tag_name }},SENTRY_ENVIRONMENT=${{ steps.target.outputs.sentry_env }} \
            --update-secrets=SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=google-oauth-client-id:latest,SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest,APP_ADMIN_EMAILS=app-admin-emails${{ steps.target.outputs.secret_suffix }}:latest,SPRING_DATASOURCE_URL=supabase-db-url${{ steps.target.outputs.secret_suffix }}:latest,SENTRY_DSN=sentry-dsn-backend:latest

      # Defence in depth — `gcloud run deploy` already fails when the revision crashes at boot.
      - name: Smoke test and summary
        run: |
          URL=$(gcloud run services describe ${{ steps.target.outputs.service }} \
            --region=northamerica-northeast1 \
            --project=${{ vars.GCP_PROJECT }} \
            --format='value(status.url)')
          echo "Hitting $URL/actuator/health..."
          curl --fail --silent --show-error --max-time 30 "$URL/actuator/health"
          echo ""
          {
            echo "## Deployment summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | **${{ steps.target.outputs.name }}** — ${{ steps.target.outputs.url }} |"
            echo "| Release | \`${{ github.event.release.tag_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`northamerica-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/backend/portfolioai:${{ github.event.release.tag_name }}\` |"
            echo "| Service URL | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"

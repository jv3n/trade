name: Frontend CI

on:
  push:
    branches: [master]
    paths:
      - 'projects/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'projects/frontend/**'
      - '.github/workflows/frontend.yml'

# Workflow-level baseline — every job inherits `contents: read`. Jobs that need to write
# elsewhere (PR coverage comment below) override at job scope. Declaring this explicit baseline
# revokes every other implicit scope on `GITHUB_TOKEN`, satisfying the CodeQL
# "missing-explicit-permissions" hint.
permissions:
  contents: read

# A new push on the same PR / branch cancels the run still in progress for the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    # Pinned rather than ubuntu-latest : the move to Ubuntu 26 is done on purpose (#274).
    runs-on: ubuntu-24.04

    # Redundant with the workflow-level block above, but the scanners want the scope declared on
    # the job too. `pull-requests: write` is what lets the sticky coverage comment be posted.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'projects/frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        working-directory: projects/frontend
        run: npm ci

      - name: Check the lib's Angular peers
        working-directory: projects/frontend
        run: npm run ui:check-peers

      - name: Check the palette contrast baseline
        working-directory: projects/frontend
        run: npm run ui:check-contrast

      - name: Lint
        working-directory: projects/frontend
        run: npm run lint

      - name: Check the icon buttons have an accessible name
        working-directory: projects/frontend
        run: npm run web:check-a11y

      - name: Build
        working-directory: projects/frontend
        run: npm run build

      # No blocking threshold for now — the report is published and read, not enforced.
      - name: Test (with coverage)
        working-directory: projects/frontend
        run: npm run test:coverage -- --watch=false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: projects/frontend/coverage/
          if-no-files-found: ignore

      # At-a-glance summary on the run page. The builder writes under `coverage/<projectName>/`,
      # not at the root of `coverage/`.
      - name: Coverage summary
        if: always() && hashFiles('projects/frontend/coverage/web/coverage-summary.json') != ''
        run: |
          node <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync('projects/frontend/coverage/web/coverage-summary.json', 'utf8'),
          );
          const total = data.total || {};
          console.log('## Frontend coverage');
          console.log('');
          console.log('| Metric | Covered | Total | % |');
          console.log('|---|---|---|---|');
          for (const key of ['lines', 'statements', 'functions', 'branches']) {
            const m = total[key];
            if (!m) continue;
            const label = key[0].toUpperCase() + key.slice(1);
            console.log(`| ${label} | ${m.covered} | ${m.total} | ${m.pct.toFixed(1)}% |`);
          }
          JS

      # Sticky PR comment with the frontend coverage table + per-file diff vs base. The action
      # reads the `coverage-summary.json` we already generate (json-summary reporter wired in
      # `angular.json > test > configurations > coverage`) and edits a single comment on every
      # push to the PR rather than spamming. `name: Frontend` disambiguates from the sibling
      # backend comment posted by the Kover action in `backend.yml`. No-op on `push master`
      # because there's no PR to comment on — guarded by the `pull_request` event check.
      - name: Comment coverage on PR
        if: |
          always()
          && github.event_name == 'pull_request'
          && hashFiles('projects/frontend/coverage/web/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Frontend
          json-summary-path: projects/frontend/coverage/web/coverage-summary.json
          json-final-path: projects/frontend/coverage/web/coverage-final.json

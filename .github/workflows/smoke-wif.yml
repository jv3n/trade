name: WIF Smoke Test

on:
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest : a new image is adopted on purpose, never by a label move.
    runs-on: ubuntu-26.04
    # No `environment:` : the checks are read-only and the GCP_* variables also exist at repo level,
    # so it runs from any branch — the one place to try the GCP path before a release (#401).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Show authenticated identity
        run: |
          echo "Active account:"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo ""
          echo "Active project:"
          gcloud config get-value project

      - name: Test run.admin permission (list Cloud Run services)
        run: |
          gcloud run services list \
            --region=northamerica-northeast1 \
            --project=${{ vars.GCP_PROJECT }}

      - name: Test artifactregistry.writer permission (describe backend repo)
        run: |
          gcloud artifacts repositories describe backend \
            --location=northamerica-northeast1 \
            --project=${{ vars.GCP_PROJECT }}

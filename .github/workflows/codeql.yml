# GitHub Code Scanning — CodeQL static analysis.
# Findings (vulnerabilities, anti-patterns) show up under "Security → Code scanning".
#
# One pass covers both sides of the app :
#   - `java-kotlin` (Kotlin / Spring backend) — build-mode `manual` : compiles without tests so
#     no Postgres is needed here (`backend.yml` stays the authority for tests).
#   - `javascript-typescript` (Angular frontend) — build-mode `none` : extracted without a build.
#
# **Not run on pull requests** : it was the slowest PR check (~3 min, the Kotlin extractor
# recompiles the whole backend) and it blocked PRs whenever a Kotlin bump outran CodeQL's
# supported version. It runs on every merge to master, weekly, and on demand instead ; findings
# still land in the Security tab.

name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    # Monday 06:00 UTC — re-reads the code even without a merge that week, catching new CodeQL
    # rules and newly published dependency vulnerabilities.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Workflow-level baseline — CodeQL `actions/missing-workflow-permissions` wants the block at
# workflow level, not only on the job. The `analyze` job widens its own scopes (write on
# security-events to publish findings, read on packages + actions).
permissions:
  contents: read

# Two merges in a row : only the latest commit needs analysing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pinned rather than ubuntu-latest : the move to Ubuntu 26 is done on purpose (#274).
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      # Dependency cache only — the build cache is deliberately not shared with backend.yml :
      # CodeQL extracts the AST during compilation, so a task served FROM-CACHE extracts nothing
      # and the analysis dies with "no source code seen during build".
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # TRAP cache stores the result of CodeQL's extraction step (compiled DB) per language
          # so subsequent runs on similar code skip re-extraction. Big win on Java/Kotlin where
          # extraction is the bottleneck (~2 min cold) ; smaller on JS/TS but still helpful.
          trap-caching: true

      # `--rerun-tasks` is mandatory : CodeQL's agent only attaches to tasks that actually run.
      - name: Compile Kotlin (no tests, no DB)
        if: matrix.language == 'java-kotlin'
        working-directory: projects/backend
        run: ./gradlew compileKotlin compileTestKotlin -x test --rerun-tasks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: '/language:${{ matrix.language }}'

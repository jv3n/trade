name: Backup Supabase Postgres

# Weekly `pg_dump` of the Supabase database to Cloudflare R2 for exit-discipline. Keeps our own
# archive independent of Supabase's proprietary snapshot format — if Supabase shrinks the free
# tier or disappears, we restore from R2 to any Postgres elsewhere (Neon, Fly Postgres, VPS…).
# Supabase already keeps 7 days of daily snapshots ; the 30 kept here are the long-term net.
#
# Needs the R2 bucket, three GitHub secrets (R2_*), three repo variables (GCP_*), and
# `roles/secretmanager.secretAccessor` granted to `github-deploy@` on `supabase-db-url`.

on:
  schedule:
    # Sunday 4 AM UTC = Saturday midnight Eastern, the quietest slot.
    - cron: '0 4 * * 0'
  # For a spot backup before a risky operation, and for the restore drills.
  workflow_dispatch:

# One backup at a time : a manual run firing while the cron one is in flight would have two
# `aws s3 cp` fighting over the same filename.
concurrency:
  group: backup-postgres
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Dump and upload to R2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # The `pg_dump` shipped on `ubuntu-latest` can trail Supabase by a major or two. A newer
      # client can always dump an older server, so pinning 16 gives a major of headroom.
      - name: Install postgresql-client-16
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet postgresql-client-16
          pg_dump --version

      # The secret holds a **JDBC** URL and libpq rejects the `jdbc:` prefix ; the rest is a valid
      # libpq URI. Masked so a later step cannot echo the credentials into the logs.
      - name: Read DATABASE_URL from Secret Manager
        id: db
        run: |
          JDBC_URL=$(gcloud secrets versions access latest \
            --secret=supabase-db-url \
            --project=${{ vars.GCP_PROJECT }})
          LIBPQ_URL="${JDBC_URL#jdbc:}"
          echo "::add-mask::$LIBPQ_URL"
          echo "url=$LIBPQ_URL" >> "$GITHUB_OUTPUT"

      # `--no-owner --no-acl` so the dump restores anywhere, without the Supabase-specific roles.
      # Plain SQL + gzip rather than `custom` : less compact, but readable with `zless` during an
      # incident. The UTC timestamp in the filename makes the alphabetical order chronological.
      - name: Dump database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          BACKUP_FILE="backup-$TIMESTAMP.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-acl --format=plain | gzip > "$BACKUP_FILE"
          ls -lh "$BACKUP_FILE"
          # `BACKUP_FILE=...` (uppercase, conventional) becomes available to subsequent steps as
          # the env var `BACKUP_FILE`. The key in `$GITHUB_ENV` defines the exported var name —
          # no auto-lowercase magic.
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      # R2 is S3-compatible ; `auto` is its conventional virtual region.
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://portfolioai-backups/$BACKUP_FILE" --endpoint-url "$ENDPOINT_URL"
          echo "BACKUP_UPLOADED=s3://portfolioai-backups/$BACKUP_FILE" >> "$GITHUB_ENV"

      # Alphabetical order is chronological (the names are UTC-timestamped), so `head -n -30` drops
      # the newest thirty and leaves the ones to delete.
      - name: Prune backups older than the 30 most recent
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          OLD=$(aws s3 ls "s3://portfolioai-backups/" --endpoint-url "$ENDPOINT_URL" \
            | grep -E 'backup-.*\.sql\.gz$' \
            | sort \
            | head -n -30 \
            | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (less than 30 backups in bucket)."
            exit 0
          fi
          echo "Pruning the following objects:"
          echo "$OLD"
          echo "$OLD" | xargs -I {} aws s3 rm "s3://portfolioai-backups/{}" --endpoint-url "$ENDPOINT_URL"

      - name: Summary
        run: |
          {
            echo "## Backup summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$BACKUP_FILE\` |"
            echo "| Destination | \`$BACKUP_UPLOADED\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

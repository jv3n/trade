name: Backup Supabase Postgres

# Monthly `pg_dump` of the Supabase database to Cloudflare R2 for exit-discipline. Keeps our own
# archive independent of Supabase's proprietary snapshot format — if Supabase shrinks the free
# tier or disappears, we restore from R2 to any Postgres elsewhere (Neon, Fly Postgres, VPS…).
# Supabase already keeps 7 days of daily snapshots ; the 12 kept here are the long-term net.
#
# Needs the R2 bucket, three GitHub secrets (R2_*), three repo variables (GCP_*), and
# `roles/secretmanager.secretAccessor` granted to `github-deploy@` on `supabase-db-url`.

on:
  schedule:
    # The 1st of the month, 4 AM UTC = midnight Eastern, the quietest slot.
    - cron: '0 4 1 * *'
  # For a spot backup before a risky operation, and for the restore drills.
  workflow_dispatch:

# One backup at a time : a manual run firing while the cron one is in flight would have two
# `aws s3 cp` fighting over the same filename.
concurrency:
  group: backup-postgres
  cancel-in-progress: false

permissions:
  contents: read

# Under this, a gzip holds no dump — an empty `pg_dump` output gzips to 20 bytes.
env:
  MIN_BACKUP_BYTES: 1024

jobs:
  backup:
    name: Dump and upload to R2
    # Pinned rather than ubuntu-latest : a new image is adopted on purpose, never by a label move.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # The client follows Supabase's major (17) : pg_dump refuses a newer server, and a dump from a
      # newer client may not restore on it. Called by its full path — Ubuntu's `pg_dump` wrapper
      # runs the newest client installed, whatever is pinned here. When Supabase upgrades, the
      # dump fails red (version mismatch) and this number moves with it (#402).
      - name: Install postgresql-client-17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # The secret holds a **JDBC** URL and libpq rejects the `jdbc:` prefix ; the rest is a valid
      # libpq URI. Masked so a later step cannot echo the credentials into the logs.
      - name: Read DATABASE_URL from Secret Manager
        id: db
        run: |
          JDBC_URL=$(gcloud secrets versions access latest \
            --secret=supabase-db-url \
            --project=${{ vars.GCP_PROJECT }})
          LIBPQ_URL="${JDBC_URL#jdbc:}"
          echo "::add-mask::$LIBPQ_URL"
          echo "url=$LIBPQ_URL" >> "$GITHUB_OUTPUT"

      # `--no-owner --no-acl` so the dump restores anywhere, without the Supabase-specific roles.
      # Plain SQL + gzip rather than `custom` : less compact, but readable with `zless` during an
      # incident. The UTC timestamp in the filename makes the alphabetical order chronological.
      - name: Dump database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          # Without it a failing pg_dump hid behind gzip's success, and every weekly run from June
          # to September uploaded a 20-byte empty file with a green check (#402).
          set -o pipefail
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          BACKUP_FILE="backup-$TIMESTAMP.sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-acl --format=plain \
            | gzip > "$BACKUP_FILE"
          ls -lh "$BACKUP_FILE"
          # Belt and braces : even the schema alone is several KB, so anything smaller is not a dump.
          SIZE=$(stat -c %s "$BACKUP_FILE")
          if [ "$SIZE" -lt "$MIN_BACKUP_BYTES" ]; then
            echo "::error::Backup is $SIZE bytes, under $MIN_BACKUP_BYTES — not uploading an empty dump."
            exit 1
          fi
          # `BACKUP_FILE=...` (uppercase, conventional) becomes available to subsequent steps as
          # the env var `BACKUP_FILE`. The key in `$GITHUB_ENV` defines the exported var name —
          # no auto-lowercase magic.
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      # R2 is S3-compatible ; `auto` is its conventional virtual region.
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://portfolioai-backups/$BACKUP_FILE" --endpoint-url "$ENDPOINT_URL"
          echo "BACKUP_UPLOADED=s3://portfolioai-backups/$BACKUP_FILE" >> "$GITHUB_ENV"

      # Empty files first — they are no backup at all — then the valid ones past the 12 most recent.
      # Counting only valid files means an empty upload can never push a real backup out. The
      # alphabetical order is chronological (UTC-timestamped names), so `head -n -12` leaves the
      # ones to delete.
      - name: Prune empty backups and keep the 12 most recent
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -o pipefail
          # `aws s3 ls` prints : date, time, size in bytes, name.
          LISTING=$(aws s3 ls "s3://portfolioai-backups/" --endpoint-url "$ENDPOINT_URL" \
            | { grep -E 'backup-.*\.sql\.gz$' || true; } | sort -k4)
          EMPTY=$(echo "$LISTING" | awk -v min="$MIN_BACKUP_BYTES" 'NF == 4 && $3 < min {print $4}')
          OLD=$(echo "$LISTING" | awk -v min="$MIN_BACKUP_BYTES" 'NF == 4 && $3 >= min {print $4}' \
            | head -n -12)
          TO_DELETE=$(printf '%s\n%s\n' "$EMPTY" "$OLD" | grep -v '^$' || true)
          if [ -z "$TO_DELETE" ]; then
            echo "Nothing to prune (no empty file, 12 valid backups or fewer)."
            exit 0
          fi
          echo "Pruning the following objects:"
          echo "$TO_DELETE"
          echo "$TO_DELETE" | xargs -I {} aws s3 rm "s3://portfolioai-backups/{}" --endpoint-url "$ENDPOINT_URL"

      - name: Summary
        run: |
          {
            echo "## Backup summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$BACKUP_FILE\` ($(stat -c %s "$BACKUP_FILE") bytes) |"
            echo "| Destination | \`$BACKUP_UPLOADED\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

# Dependabot — one grouped PR per ecosystem, patch and minor only.
#
# **No majors** : a major can carry silent breaking changes (springdoc 3.x targets Spring Boot 4,
# Kotlin 2.1 → 2.3 breaks Detekt's pinned `resolutionStrategy`), so they are taken on by hand when
# the context is ready. The specific `ignore` blocks below add the bumps that are known to be
# blocked by a peer dependency ; Dependabot reopens them on its own once that changes.
#
# The trade-off of grouping : when CI breaks, the guilty bump is bisected by hand inside the PR.

version: 2

updates:
  # ─────────────────────────────────────────────────────────────────────── Backend Gradle
  - package-ecosystem: gradle
    directory: /projects/backend
    schedule:
      interval: daily
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 10
    groups:
      all:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      # CodeQL 2.27.0's Kotlin extractor cannot compile 2.4.20 — `Analyze (java-kotlin)` fails
      # while `Backend CI` passes. Drop these once the extractor catches up (see #243).
      #
      # The plugins are declared through the `kotlin("…")` accessor, so Dependabot names them
      # after its argument — `jvm`, `plugin.spring`, `plugin.jpa` — not by plugin id. The
      # trailing `org.jetbrains.kotlin*` covers the `id("…")` form should the build ever switch;
      # without it the hold would silently stop matching. Each is pinned to the one bad version,
      # so a name as generic as `jvm` cannot block anything else.
      - dependency-name: 'jvm'
        versions: ['2.4.20']
      - dependency-name: 'plugin.spring'
        versions: ['2.4.20']
      - dependency-name: 'plugin.jpa'
        versions: ['2.4.20']
      - dependency-name: 'org.jetbrains.kotlin*'
        versions: ['2.4.20']

  # ─────────────────────────────────────────────────────────────────────── Frontend npm
  - package-ecosystem: npm
    directory: /projects/frontend
    schedule:
      interval: daily
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 10
    groups:
      all:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      # Zone.js was removed (the app is zoneless) — if a transitive dependency drags it back in,
      # block every bump, not just the majors.
      - dependency-name: 'zone.js'

  # ─────────────────────────────────────────────────────────────────────── GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

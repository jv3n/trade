# Cloud Run service descriptor — PortfolioAI production
#
# **Stub** : documents the shape of the Cloud Run service. The deploy itself is imperative
# (`gcloud run deploy` in `.github/workflows/deploy.yml`), so **that workflow is the source of
# truth** — this file is deliberately not in sync with it (it omits `SENTRY_DSN`, mounted at
# runtime through `--update-secrets`). Moving to `gcloud run services replace` would mean adding
# the missing secrets to the `env:` block below.
#
# The `TODO_...` tags are placeholders to fill at the first deploy.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: portfolioai
  namespace: trade-496613  # project ID
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all  # public — the app does its own auth
spec:
  template:
    metadata:
      annotations:
        # Single user : three instances is plenty.
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/minScale: "0"  # scale-to-zero (cold-start ~1-3 s)
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"  # shortens the cold start
    spec:
      serviceAccountName: portfolioai-runtime@trade-496613.iam.gserviceaccount.com
      timeoutSeconds: 300
      containerConcurrency: 80  # default Cloud Run, fits single-user

      containers:
        - image: northamerica-northeast1-docker.pkg.dev/trade-496613/backend/portfolioai:TODO_TAG  # filled at deploy time
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
          # Health checks (Cloud Run respecte le startupProbe avant de router le trafic)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30  # ~5 min pour le cold-start Spring Boot + Flyway
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            failureThreshold: 3

          env:
            # Active Spring profile in prod
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            # Public URL of the app, read by SecurityConfig.defaultSuccessUrl — update it when a
            # custom domain is attached.
            - name: APP_FRONTEND_URL
              value: TODO_URL

            # Boot-time secrets mounted from GCP Secret Manager
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth-client-id
                  key: latest
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth-client-secret
                  key: latest
            - name: APP_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: app-admin-emails
                  key: latest
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db-url
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100

<mat-form-field appearance="outline" class="period-field" subscriptSizing="dynamic">
  @if (labelled()) {
    <mat-label>{{ 'periods.label' | translate }}</mat-label>
  }
  <mat-select
    [value]="selection().period"
    (selectionChange)="pickPreset($event.value)"
    [aria-label]="'periods.label' | translate"
  >
    @for (p of presets; track p) {
      <mat-option [value]="p">{{ 'periods.presets.' + p | translate }}</mat-option>
    }
  </mat-select>
</mat-form-field>

@if (selection().period === 'custom') {
  <mat-form-field appearance="outline" class="date-field" subscriptSizing="dynamic">
    <mat-label>{{ 'periods.dateFrom' | translate }}</mat-label>
    <input
      matInput
      readonly
      [matDatepicker]="fromPicker"
      [value]="selection().dateFrom"
      (dateChange)="setDateFrom($event.value)"
      (click)="fromPicker.open()"
    />
    <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
    <mat-datepicker #fromPicker />
  </mat-form-field>

  <mat-form-field appearance="outline" class="date-field" subscriptSizing="dynamic">
    <mat-label>{{ 'periods.dateTo' | translate }}</mat-label>
    <input
      matInput
      readonly
      [matDatepicker]="toPicker"
      [value]="selection().dateTo"
      (dateChange)="setDateTo($event.value)"
      (click)="toPicker.open()"
    />
    <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
    <mat-datepicker #toPicker />
  </mat-form-field>
}

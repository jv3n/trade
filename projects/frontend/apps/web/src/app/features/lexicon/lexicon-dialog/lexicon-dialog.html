<h2 mat-dialog-title>
  {{ (isEdit() ? 'lexicon.dialog.editTitle' : 'lexicon.dialog.createTitle') | translate }}
</h2>

<form (submit)="$event.preventDefault(); submit()" class="lexicon-form">
  <mat-dialog-content class="form-stack">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'lexicon.fields.term' | translate }}</mat-label>
      <input #termField matInput [formField]="lexiconForm.term" />
      <ui-form-field-reset matIconSuffix [for]="termField" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'lexicon.fields.definitionFr' | translate }}</mat-label>
      <textarea
        #definitionFrField
        matInput
        [formField]="lexiconForm.definitionFr"
        rows="4"
      ></textarea>
      <ui-form-field-reset matIconSuffix [for]="definitionFrField" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'lexicon.fields.definitionEn' | translate }}</mat-label>
      <textarea
        #definitionEnField
        matInput
        [formField]="lexiconForm.definitionEn"
        rows="4"
      ></textarea>
      <ui-form-field-reset matIconSuffix [for]="definitionEnField" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancel()">
      {{ 'lexicon.dialog.cancel' | translate }}
    </button>
    <button mat-flat-button type="submit">
      <mat-icon>save</mat-icon>
      <span>{{ 'lexicon.dialog.save' | translate }}</span>
    </button>
  </mat-dialog-actions>
</form>

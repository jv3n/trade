<div class="lexicon-admin-page" data-testid="lexicon-admin-page">
  <header class="page-header">
    <div class="header-row">
      <div>
        <h2>{{ 'settings.lexiconPage.title' | translate }}</h2>
        <p class="description">{{ 'settings.lexiconPage.description' | translate }}</p>
      </div>
      <button mat-flat-button type="button" (click)="openCreate()">
        <mat-icon>add</mat-icon>
        <span>{{ 'lexicon.addTerm' | translate }}</span>
      </button>
    </div>
  </header>

  @if (error(); as msg) {
    <div class="error-banner">
      <mat-icon>error</mat-icon>
      <span>{{ msg }}</span>
    </div>
  }

  @if (gate.skeleton()) {
    <ui-skeleton-table [columns]="skeletonColumns()" [label]="'lexicon.loading' | translate" />
  } @else if (!gate.content()) {
    <!-- The first load, inside its show delay : nothing yet, so a fast answer never flashes. -->
  } @else if (entries().length === 0) {
    <div class="stb-fade-in empty-state">
      <mat-icon>menu_book</mat-icon>
      <p>{{ 'lexicon.emptyAdmin' | translate }}</p>
    </div>
  } @else {
    <app-lexicon-table
      class="stb-fade-in"
      [entries]="entries()"
      [editable]="true"
      (editEntry)="openEdit($event)"
      (deleteEntry)="delete($event)"
    />
  }
</div>

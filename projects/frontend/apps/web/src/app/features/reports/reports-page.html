<div class="page page--full reports-page" data-testid="reports-page">
  <header class="page-header">
    <div>
      <h2>{{ 'reports.title' | translate }}</h2>
      <p class="description">{{ 'reports.subtitle' | translate }}</p>
    </div>
  </header>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="report-tabs">
    <a
      mat-tab-link
      routerLink="."
      routerLinkActive
      #cashFlow="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="cashFlow.isActive"
      data-testid="tab-cash-flow"
    >
      {{ 'reports.tabs.cashFlow' | translate }}
    </a>
    <a
      mat-tab-link
      routerLink="rules"
      routerLinkActive
      #rules="routerLinkActive"
      [active]="rules.isActive"
      data-testid="tab-rules"
    >
      {{ 'reports.tabs.rules' | translate }}
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <router-outlet />
  </mat-tab-nav-panel>
</div>

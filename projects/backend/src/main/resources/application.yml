server:
  port: ${BACKEND_HOST_PORT:8080}
  # The SPA runs on its own port in dev and proxies to here with `xfwd`. Spring must read the
  # forwarded headers to build the OAuth `redirect_uri` on the SPA's host — otherwise Google
  # receives the backend's port and the session cookie is unreadable by the SPA.
  forward-headers-strategy: framework

spring:
  application:
    name: portfolioai-backend

  # Transport-level backstop for the trade screenshot ; the real guard (type + size) is in the
  # service.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # No `spring.profiles.group` here on purpose : the Tiltfile picks the profiles from
  # `BACKEND_AUTH_MODE`, which is what makes the runtime auth toggle possible.

  # OAuth2 client registration is deliberately **absent** : `ClientRegistration.Builder.build()`
  # asserts a non-empty client-id and crashes at boot, so a fresh clone or a CI run could not
  # start. Cloud Run and `application-local.yml` provide it through env vars.

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/portfolioai
    username: portfolioai
    password: portfolioai
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Zero, not one : with `baseline-version: 1` Flyway writes the baseline at V1 and never applies
    # it on an empty database, so no table is created and `ddl-auto: validate` crashes at boot.
    baseline-version: 0

management:
  endpoints:
    web:
      # `metrics` is public on this profile (`SecurityConfig` leaves `/actuator/**` but `/health`
      # permitted) — fine on localhost, drop it before exposing the app through a tunnel.
      # `application-prod.yml` narrows the list to health + info.
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    git:
      # `simple` would only expose branch + commit id + time, too little to tie a Cloud Run
      # revision back to a release tag.
      mode: full

# Consumed by `CustomOAuth2UserService` on **first** user creation to assign ADMIN vs USER ;
# existing rows keep the role they got at first login. The set checked at login is
# `admins ∪ allowed_emails`, so an admin cannot lock themselves out from the UI. An empty
# `allowed.emails` means open mode — the state a fresh deploy starts in.
app:
  admin:
    emails: ${APP_ADMIN_EMAILS:}
  allowed:
    emails: ${APP_ALLOWED_EMAILS:}
  # `/` is right when the SPA and the backend share an origin (prod). In dev the SPA has its own
  # port : `application-local.yml` overrides it, or the user lands on a Whitelabel 404 after login.
  frontend-url: ${APP_FRONTEND_URL:/}

# ECB reference rates, published once per business day, keyless — enough for the cosmetic USD→CAD
# conversion of the account balance.
forex:
  frankfurter:
    base-url: https://api.frankfurter.dev/v1

# Empty DSN = the SDK no-ops, so a fresh clone and CI ship no event. `application-prod.yml` provides
# the real one.
sentry:
  dsn: ${SENTRY_DSN:}
  # Keep false : true would ship `User-Agent`, `Cookie`, `Referer` and the IP. The userId UUID is
  # attached through the Logback MDC instead (`SentryUserContextFilter`), never the email.
  send-default-pii: false

# Off by default so no environment exposes the REST surface without opting in ; the `local` profile
# turns both on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

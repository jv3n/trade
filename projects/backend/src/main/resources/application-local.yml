# Local profile — behaviour overrides for solo dev under Tilt. No secrets here: credentials live in
# `.env` at the repo root and reach Spring through the relaxed binding.

spring:
  # Beans are created on first use instead of at boot. A wiring error then surfaces on the first
  # call to the bean rather than at startup — accepted in dev, never in prod.
  main:
    lazy-initialization: true

  # `backend-compile` (Tiltfile) recompiles into the classpath devtools polls, which restarts the
  # context in ~2 s instead of a full `bootRun`. Gradle writes classes in bursts, so the quiet
  # period has to outlast a compile round or the context restarts mid-write.
  devtools:
    restart:
      quiet-period: 1s
      poll-interval: 2s

  # Flip to `true` when chasing a persistence behaviour (N+1, unwanted lazy fetch): every cache hit
  # and every ownership check otherwise adds 3-5 lines of SQL to the Tilt logs.
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    repair-on-migrate: true

# Enabled locally only — `application.yml` keeps it off everywhere else.
# Swagger UI: http://localhost:${BACKEND_HOST_PORT}/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Spring profile `prod` — Cloud Run + Supabase Postgres.
# Behaviour overrides only ; the runtime credentials are mounted from GCP Secret Manager.

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  # 30 s to drain in-flight requests while Cloud Run rolls out a new revision.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    hikari:
      # 3 Cloud Run instances × 10 = 30 connections at most, under the 60 of the Supabase free tier.
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  mvc:
    log-resolved-exception: false

logging:
  level:
    root: INFO
    com.portfolioai: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
    okhttp3: WARN
    org.flywaydb.core: INFO
  pattern:
    # Single line for Cloud Logging. `[%X{userId:-}]` carries the userId UUID of an authenticated
    # request — never the email (cf. `CLAUDE.md > Backend`).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{userId:-}] %logger{36} - %msg%n"

sentry:
  dsn: ${SENTRY_DSN:}
  # Staging runs this same profile : `deploy.yml` sets `staging` so its errors stay apart (#297).
  environment: ${SENTRY_ENVIRONMENT:prod}
  # The GitHub Release tag, propagated by `deploy.yml` — it is what attributes a regression to a
  # release in the dashboard.
  release: ${SENTRY_RELEASE:}
  # Errors only : tracing every transaction would burn the free-tier quota for no use on a solo app.
  traces-sample-rate: 0.0
  # Frames outside these packages show up greyed out in the stack trace.
  in-app-includes: com.portfolioai

management:
  endpoints:
    web:
      # No `env` and no `configprops` in prod — leak risk.
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# `app.*` and the Google OAuth registration are not repeated here : Cloud Run mounts them as env
# vars and Spring's relaxed binding picks them up from the base config. Declaring them again would
# risk an unresolvable placeholder.
